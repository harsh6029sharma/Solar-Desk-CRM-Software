<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarDesk CRM - Enterprise Solar SaaS</title>
  <meta name="description" content="Next-generation enterprise CRM for solar installations, lead management, and service operations.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/index.css">
  
  <!-- Icon library (Lucide) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Loading State Overlay -->
  <div id="global-loader" class="global-loader hide">
    <div class="spinner"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main SPA Container -->
  <div id="app-container" class="app-container unauthenticated">
    
    <!-- Sidebar (hides on login page) -->
    <aside id="sidebar-mount" class="sidebar"></aside>

    <!-- Content Area -->
    <div class="main-wrapper">
      
      <!-- Top Navbar (hides on login page) -->
      <header id="navbar-mount" class="navbar"></header>

      <!-- Main Page Render Target -->
      <main id="app" class="content-body"></main>
      
    </div>
  </div>

  <!-- Modal Mount Point -->
  <div id="modal-container" class="modal-overlay hide">
    <div class="modal-box">
      <header class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button id="modal-close-btn" class="modal-close">&times;</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- App Entry Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
